appId: ai.bookkeep.desktop
productName: BookKeepAI
copyright: Copyright © 2026 BookKeepAI

directories:
  output: release
  buildResources: assets/app

# 只打包已构建产物与生产依赖；源码、测试、脚本、文档不进入软件 ZIP。
files:
  - package.json
  - dist/**/*
  - node_modules/better-sqlite3/**/*
  - node_modules/sharp/**/*
  - node_modules/@img/**/*
  - node_modules/@emnapi/**/*
  - node_modules/detect-libc/**/*
  - node_modules/semver/**/*
  - "!**/*.map"
  - "!**/*.md"
  - "!node_modules/better-sqlite3/{deps,src}/**"
  - "!node_modules/better-sqlite3/prebuilds/!(win32-x64).node"
  - "!node_modules/better-sqlite3/build/**"

extraResources:
  - from: resources/licenses
    to: licenses

asar: true
asarUnpack:
  - "**/node_modules/better-sqlite3/**"
  - "**/node_modules/sharp/**"
  - "**/node_modules/@img/**"

# 原生模块为 Node-API 预编译，S04 已在 Electron ABI 下验证加载，不做二次 rebuild。
npmRebuild: false
buildDependenciesFromSource: false

win:
  target:
    - target: zip
      arch:
        - x64
  icon: assets/app/icon.png
  artifactName: BookKeepAI-${version}-win-x64.${ext}
  requestedExecutionLevel: asInvoker
  legalTrademarks: ""
